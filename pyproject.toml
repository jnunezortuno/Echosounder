[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echosounder-python"
version = "1.0.0"
description = "Interfaz Python para Echosounder con adquisición serie y simulación"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "PySide6>=6.10,<7", "pyqtgraph>=0.13.7,<0.15", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
echosounder = "echosounder.__main__:main"

[tool.setuptools]
packages = ["echosounder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
